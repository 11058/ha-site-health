[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3 flag Cyrillic letters as "ambiguous"; the dashboard generator holds
# Russian UI labels on purpose.
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# RouterOS one-liners are pasted verbatim; splitting them hurts more than it helps.
"custom_components/site_health/provision.py" = ["E501"]
